<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Are they gonna PR?</title>
<meta name="description" content="Enter your distance and time to see if you're on pace to beat a 2:47:34 marathon PB.">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --field: #f5f5f7;
    --good: #248a3d;
    --bad: #d70015;
    --focus: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --ink: #f5f5f7;
      --muted: #86868b;
      --field: #1d1d1f;
      --good: #30d158;
      --bad: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(3.5rem, env(safe-area-inset-top)) 1.5rem max(3rem, env(safe-area-inset-bottom));
  }
  main { max-width: 34rem; margin: 0 auto; }

  h1 {
    font-size: clamp(1.9rem, 8vw, 2.75rem);
    font-weight: 600;
    letter-spacing: -.025em;
    line-height: 1.1;
    margin: 0 0 .5rem;
  }
  .caption { margin: 0 0 2.5rem; color: var(--muted); }

  .field { margin-bottom: 1.5rem; }
  .field-head { display: flex; align-items: center; justify-content: space-between; min-height: 2rem; margin-bottom: .5rem; }
  .label { font-size: .8rem; letter-spacing: .02em; color: var(--muted); text-transform: uppercase; }

  input[type="number"] {
    width: 100%;
    padding: .85rem 1rem;
    font: inherit;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--field);
    border: 0;
    border-radius: 12px;
    -webkit-appearance: none;
    appearance: textfield;
  }
  input[type="number"]:focus { outline: 2px solid var(--focus); outline-offset: 0; }
  input[type="number"]::placeholder { color: var(--muted); }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .seg { display: inline-flex; background: var(--field); border-radius: 9px; padding: 2px; }
  .seg-btn {
    min-width: 2.9rem;
    min-height: 2.5rem;
    padding: 0 .5rem;
    font: inherit;
    font-size: .85rem;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
  }
  .seg-btn[aria-pressed="true"] { background: var(--bg); color: var(--ink); font-weight: 600; }

  .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
  .time-grid input { text-align: center; }

  .verdict {
    margin: 2.75rem 0 0;
    font-size: clamp(1.5rem, 6.5vw, 2rem);
    font-weight: 600;
    letter-spacing: -.02em;
    min-height: 1.2em;
  }
  .verdict[data-state="on"] { color: var(--good); }
  .verdict[data-state="off"] { color: var(--bad); }
  .verdict[data-state="idle"] { color: var(--muted); }
  .detail { margin: .5rem 0 0; color: var(--muted); min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>Are they gonna PR?</h1>
  <p class="caption">PB to beat <span id="pb">2:47:34</span></p>

  <div class="field">
    <div class="field-head">
      <label class="label" for="distance">Distance</label>
      <div class="seg" role="group" aria-label="Distance unit">
        <button type="button" class="seg-btn" data-unit="km" aria-pressed="true">km</button>
        <button type="button" class="seg-btn" data-unit="mi" aria-pressed="false">mi</button>
      </div>
    </div>
    <input id="distance" type="number" inputmode="decimal" step="any" min="0" placeholder="21.1">
  </div>

  <div class="field">
    <div class="field-head"><span class="label" id="timeLabel">Time</span></div>
    <div class="time-grid" role="group" aria-labelledby="timeLabel">
      <input id="th" type="number" inputmode="numeric" step="1" min="0" placeholder="hh" aria-label="Hours">
      <input id="tm" type="number" inputmode="numeric" step="1" min="0" placeholder="mm" aria-label="Minutes">
      <input id="ts" type="number" inputmode="numeric" step="1" min="0" placeholder="ss" aria-label="Seconds">
    </div>
  </div>

  <p class="verdict" id="verdict" data-state="idle" role="status" aria-live="polite"></p>
  <p class="detail" id="detail"></p>
</main>

<script src="pace.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var distEl = $('distance'), thEl = $('th'), tmEl = $('tm'), tsEl = $('ts');
  var unitBtns = Array.prototype.slice.call(document.querySelectorAll('.seg-btn'));
  var verdict = $('verdict'), detail = $('detail');
  var unit = 'km';

  function num(el) { var v = parseFloat(el.value); return isFinite(v) ? v : 0; }
  function clock(seconds) { return Pace.fmtClock(seconds); }
  /* distances coming out of Pace.analyze() are already in the chosen unit */
  function dist(value, u) { return value.toFixed(value < 1 ? 2 : 1) + ' ' + u; }

  function show(text, state, sub) {
    verdict.textContent = text;
    verdict.setAttribute('data-state', state);
    detail.textContent = sub || '';
  }

  function render() {
    var d = num(distEl);
    var seconds = num(thEl) * 3600 + num(tmEl) * 60 + num(tsEl);
    var r = Pace.analyze(d, unit, seconds);
    var u = r.unit;

    if (r.status === 'incomplete') { show('', 'idle', ''); return; }

    if (r.status === 'finished') {
      var over = r.delta >= 0;
      show(
        r.pr ? 'PR!' : 'No PR',
        r.pr ? 'on' : 'off',
        clock(r.seconds) + ' for ' + dist(r.fullDistance, u) + ' — ' + clock(Math.abs(r.delta)) + (over ? ' over' : ' under') + ' the PB'
      );
      return;
    }

    if (r.status === 'impossible') {
      show('PR out of reach', 'off', clock(r.seconds) + ' elapsed with ' + dist(r.remaining, u) + ' to go');
      return;
    }

    if (Math.abs(r.delta) < 1) {
      show('Dead level', 'off', 'projected ' + clock(r.projected) + ' — exactly PB pace');
      return;
    }

    var ahead = r.delta < 0;
    show(
      r.status === 'on' ? 'On pace' : 'Off pace',
      r.status === 'on' ? 'on' : 'off',
      'projected ' + clock(r.projected) + ' — ' + clock(Math.abs(r.delta)) + (ahead ? ' under' : ' over') + ' the PB'
    );
  }

  distEl.addEventListener('input', render);
  [thEl, tmEl, tsEl].forEach(function (el) { el.addEventListener('input', render); });
  unitBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      unit = btn.getAttribute('data-unit');
      unitBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
      render();
    });
  });

  $('pb').textContent = clock(Pace.PB_SECONDS);
  render();
}());
</script>
</body>
</html>
