<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Are they gonna PR?</title>
<meta name="description" content="Enter your distance and time to see if you're on pace to beat a 2:47:34 marathon PB.">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --line: #d2d2d7;
    --good: #248a3d;
    --bad: #d70015;
    --focus: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --ink: #f5f5f7;
      --muted: #86868b;
      --line: #424245;
      --good: #30d158;
      --bad: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(3.5rem, env(safe-area-inset-top)) 1.5rem max(3rem, env(safe-area-inset-bottom));
  }
  main { max-width: 34rem; margin: 0 auto; }

  h1 {
    font-size: clamp(1.9rem, 8vw, 2.75rem);
    font-weight: 600;
    letter-spacing: -.025em;
    line-height: 1.1;
    margin: 0 0 .5rem;
  }
  .caption { margin: 0 0 2.75rem; color: var(--muted); }

  .entry { font-size: 1.375rem; }
  .line {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: .6rem .55rem;
    margin-bottom: 1.6rem;
  }
  .pair { display: inline-flex; align-items: baseline; gap: .4rem; white-space: nowrap; }
  .word { color: var(--ink); }

  /* fill-in-the-blank fields: plain numbers over a thin rule */
  input[type="number"] {
    font: inherit;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 2px solid var(--line);
    border-radius: 0;
    padding: 0 .1rem .3rem;
    -webkit-appearance: none;
    appearance: textfield;
  }
  input[type="number"]:focus { outline: 0; border-bottom-color: var(--focus); }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .n-dist { width: 6ch; }
  .n-time { width: 2.8ch; }

  /* the unit doubles as the toggle: "10 mi" → tap mi for km */
  .unit-btn {
    font: inherit;
    color: var(--muted);
    background: none;
    border: 0;
    padding: .25rem 0;
    cursor: pointer;
    text-decoration: underline dotted;
    text-decoration-color: var(--line);
    text-underline-offset: .32em;
    -webkit-tap-highlight-color: transparent;
  }

  .verdict {
    margin: 2rem 0 0;
    font-size: clamp(1.5rem, 6.5vw, 2rem);
    font-weight: 600;
    letter-spacing: -.02em;
    min-height: 1.2em;
  }
  .verdict[data-state="on"] { color: var(--good); }
  .verdict[data-state="off"] { color: var(--bad); }
  .verdict[data-state="idle"] { color: var(--muted); }
  .detail { margin: .5rem 0 0; color: var(--muted); min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>Are they gonna PR?</h1>
  <p class="caption">PB to beat <span id="pb">2:47:34</span></p>

  <div class="entry">
    <div class="line">
      <input id="distance" class="n-dist" type="number" inputmode="decimal" step="any" min="0" aria-label="Distance covered">
      <button type="button" class="unit-btn" id="unitBtn" aria-label="Switch distance unit to kilometres">mi</button>
    </div>

    <div class="line" role="group" aria-label="Elapsed time">
      <span class="pair"><input id="th" class="n-time" type="number" inputmode="numeric" step="1" min="0" aria-label="Hours"><span class="word">hours,</span></span>
      <span class="pair"><input id="tm" class="n-time" type="number" inputmode="numeric" step="1" min="0" aria-label="Minutes"><span class="word">minutes and</span></span>
      <span class="pair"><input id="ts" class="n-time" type="number" inputmode="numeric" step="1" min="0" aria-label="Seconds"><span class="word">seconds</span></span>
    </div>
  </div>

  <p class="verdict" id="verdict" data-state="idle" role="status" aria-live="polite"></p>
  <p class="detail" id="detail"></p>
</main>

<script src="pace.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var distEl = $('distance'), thEl = $('th'), tmEl = $('tm'), tsEl = $('ts');
  var unitBtn = $('unitBtn');
  var verdict = $('verdict'), detail = $('detail');
  var unit = unitBtn.textContent.trim() === 'km' ? 'km' : 'mi';

  function num(el) { var v = parseFloat(el.value); return isFinite(v) ? v : 0; }
  function clock(seconds) { return Pace.fmtClock(seconds); }
  /* distances coming out of Pace.analyze() are already in the chosen unit */
  function dist(value, u) { return value.toFixed(value < 1 ? 2 : 1) + ' ' + u; }

  function show(text, state, sub) {
    verdict.textContent = text;
    verdict.setAttribute('data-state', state);
    detail.textContent = sub || '';
  }

  function render() {
    var d = num(distEl);
    var seconds = num(thEl) * 3600 + num(tmEl) * 60 + num(tsEl);
    var r = Pace.analyze(d, unit, seconds);
    var u = r.unit;

    if (r.status === 'incomplete') { show('', 'idle', ''); return; }

    if (r.status === 'finished') {
      var over = r.delta >= 0;
      show(
        r.pr ? 'PR!' : 'No PR',
        r.pr ? 'on' : 'off',
        clock(r.seconds) + ' for ' + dist(r.fullDistance, u) + ' — ' + clock(Math.abs(r.delta)) + (over ? ' over' : ' under') + ' the PB'
      );
      return;
    }

    if (r.status === 'impossible') {
      show('PR out of reach', 'off', clock(r.seconds) + ' elapsed with ' + dist(r.remaining, u) + ' to go');
      return;
    }

    if (Math.abs(r.delta) < 1) {
      show('Dead level', 'off', 'projected ' + clock(r.projected) + ' — exactly PB pace');
      return;
    }

    var ahead = r.delta < 0;
    show(
      r.status === 'on' ? 'On pace' : 'Off pace',
      r.status === 'on' ? 'on' : 'off',
      'projected ' + clock(r.projected) + ' — ' + clock(Math.abs(r.delta)) + (ahead ? ' under' : ' over') + ' the PB'
    );
  }

  function setUnit(next) {
    unit = next;
    unitBtn.textContent = next;
    unitBtn.setAttribute('aria-label', 'Switch distance unit to ' + (next === 'mi' ? 'kilometres' : 'miles'));
    render();
  }

  distEl.addEventListener('input', render);
  [thEl, tmEl, tsEl].forEach(function (el) { el.addEventListener('input', render); });
  unitBtn.addEventListener('click', function () { setUnit(unit === 'mi' ? 'km' : 'mi'); });

  $('pb').textContent = clock(Pace.PB_SECONDS);
  render();
}());
</script>
</body>
</html>
