<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Are they gonna PR?</title>
<meta name="description" content="Enter your distance and time to see if you're on pace to beat a 2:47:34 marathon PB.">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --line: #d2d2d7;
    --good: #248a3d;
    --bad: #d70015;
    --focus: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --ink: #f5f5f7;
      --muted: #86868b;
      --line: #424245;
      --good: #30d158;
      --bad: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
    padding: max(4.5rem, env(safe-area-inset-top)) 1.25rem max(3rem, env(safe-area-inset-bottom));
  }
  main { max-width: 34rem; margin: 0 auto; }

  h1 {
    font-size: clamp(1.9rem, 8vw, 2.75rem);
    font-weight: 600;
    letter-spacing: -.025em;
    line-height: 1.1;
    margin: 0 0 3.25rem;
  }

  .entry { font-size: 1.3125rem; }
  .line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    flex-wrap: wrap;
    gap: .5rem .45rem;
    margin-bottom: 1.75rem;
  }
  .pair { display: inline-flex; align-items: baseline; gap: .3rem; white-space: nowrap; }
  .word { font-size: .72em; color: var(--muted); }

  /* fill-in-the-blank fields: plain numbers over a thin rule */
  input[type="number"] {
    font: inherit;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 2px solid var(--line);
    border-radius: 0;
    padding: 0 .1rem .3rem;
    -webkit-appearance: none;
    appearance: textfield;
  }
  input[type="number"]:focus { outline: 0; border-bottom-color: var(--focus); }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .n-dist { width: 6ch; }
  .n-time { width: 2.7ch; }

  /* the unit doubles as the toggle: "10 mi" → tap mi for km */
  .unit-btn {
    font: inherit;
    color: var(--muted);
    background: none;
    border: 0;
    padding: .25rem 0;
    cursor: pointer;
    text-decoration: underline dotted;
    text-decoration-color: var(--line);
    text-underline-offset: .32em;
    -webkit-tap-highlight-color: transparent;
  }

  .verdict {
    margin: 2.25rem 0 0;
    font-size: clamp(1.5rem, 6.5vw, 2rem);
    font-weight: 600;
    letter-spacing: -.02em;
    min-height: 1.2em;
  }
  /* keep "…hours, …minutes and …seconds" on one line on the narrowest phones */
  @media (max-width: 360px) {
    .entry { font-size: 1.15rem; }
    .line { gap: .5rem .35rem; }
  }
  .verdict[data-state="on"] { color: var(--good); }
  .verdict[data-state="off"] { color: var(--bad); }
  .verdict[data-state="idle"] { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Are they gonna PR?</h1>

  <div class="entry">
    <div class="line">
      <input id="distance" class="n-dist" type="number" inputmode="decimal" step="any" min="0" aria-label="Distance covered">
      <button type="button" class="unit-btn" id="unitBtn" aria-label="Switch distance unit to kilometres">mi</button>
    </div>

    <div class="line" role="group" aria-label="Elapsed time">
      <span class="pair"><input id="th" class="n-time" type="number" inputmode="numeric" step="1" min="0" aria-label="Hours"><span class="word">hours,</span></span>
      <span class="pair"><input id="tm" class="n-time" type="number" inputmode="numeric" step="1" min="0" aria-label="Minutes"><span class="word">minutes and</span></span>
      <span class="pair"><input id="ts" class="n-time" type="number" inputmode="numeric" step="1" min="0" aria-label="Seconds"><span class="word">seconds</span></span>
    </div>
  </div>

  <p class="verdict" id="verdict" data-state="idle" role="status" aria-live="polite"></p>
</main>

<script src="pace.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var distEl = $('distance'), thEl = $('th'), tmEl = $('tm'), tsEl = $('ts');
  var unitBtn = $('unitBtn');
  var verdict = $('verdict');
  var unit = unitBtn.textContent.trim() === 'km' ? 'km' : 'mi';

  function num(el) { var v = parseFloat(el.value); return isFinite(v) ? v : 0; }

  function show(text, state) {
    verdict.textContent = text;
    verdict.setAttribute('data-state', state);
  }

  function render() {
    var d = num(distEl);
    var seconds = num(thEl) * 3600 + num(tmEl) * 60 + num(tsEl);
    var r = Pace.analyze(d, unit, seconds);

    if (r.status === 'incomplete') { show('', 'idle'); return; }
    if (r.status === 'finished') { show(r.pr ? 'PR!' : 'No PR', r.pr ? 'on' : 'off'); return; }
    if (r.status === 'impossible') { show('PR out of reach', 'off'); return; }
    if (Math.abs(r.delta) < 1) { show('Dead level', 'off'); return; }
    show(r.onPace ? 'On pace' : 'Off pace', r.onPace ? 'on' : 'off');
  }

  function setUnit(next) {
    unit = next;
    unitBtn.textContent = next;
    unitBtn.setAttribute('aria-label', 'Switch distance unit to ' + (next === 'mi' ? 'kilometres' : 'miles'));
    render();
  }

  distEl.addEventListener('input', render);
  [thEl, tmEl, tsEl].forEach(function (el) { el.addEventListener('input', render); });
  unitBtn.addEventListener('click', function () { setUnit(unit === 'mi' ? 'km' : 'mi'); });

  render();
}());
</script>
</body>
</html>
