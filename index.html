<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Is Drew gonna PR?</title>
<meta name="description" content="Enter how far Drew is and the clock to see whether he's on pace to beat his 2:47:34 marathon PB.">
<style>
  /* Instrument Sans (SIL OFL 1.1) — self-hosted so every device renders the same */
  @font-face {
    font-family: "Instrument Sans";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url(fonts/instrument-sans-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Instrument Sans";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url(fonts/instrument-sans-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --bg: #ffffff;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --line: #cfcfd4;
    --chip: #f0f0f2;
    --good: #1f7a3d;
    --bad: #c8000f;
    --focus: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --ink: #f5f5f7;
      --muted: #8e8e93;
      --line: #48484a;
      --chip: #2c2c2e;
      --good: #34d15f;
      --bad: #ff4b3e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font: 400 17px/1.5 "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-align: center;
    padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 32rem; margin: 0 auto; }

  h1 {
    font-size: clamp(2rem, 8.4vw, 3rem);
    font-weight: 600;
    letter-spacing: -.035em;
    line-height: 1.05;
    text-wrap: balance;
    margin: 0 0 3rem;
  }

  /* one sentence: "He hit 13.1 miles ⇄ in 1 hours, 23 minutes and 47 seconds" */
  .sentence {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    gap: .3rem .4rem;
    margin: 0 0 2.5rem;
    font-size: clamp(.85rem, 4.5vw, 1.25rem);
    letter-spacing: -.005em;
    line-height: 1.7;
  }
  .tail { display: inline-flex; align-items: baseline; gap: .4rem; white-space: nowrap; }
  .times { display: inline-flex; align-items: baseline; gap: .4rem; }
  .pair { display: inline-flex; align-items: baseline; gap: .25rem; white-space: nowrap; }

  /* fill-in-the-blank fields: plain numbers over a thin rule */
  input[type="number"] {
    font: inherit;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 1.5px solid var(--line);
    border-radius: 0;
    padding: 0 .1rem .22rem;
    -webkit-appearance: none;
    appearance: textfield;
  }
  input[type="number"]:focus { outline: 0; border-bottom-color: var(--focus); }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .n-dist { width: 5.5ch; }
  .n-time { width: 2.5ch; }

  /* the unit word is the switch: tap "miles ⇄" and the number converts with it */
  .unit-switch {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: .45rem .55rem;
    margin: -.45rem -.55rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .15s ease;
  }
  .unit-switch:hover, .unit-switch:focus-visible { background: var(--chip); outline: 0; }
  .unit-switch svg { display: block; flex: none; color: var(--muted); }

  .verdict {
    margin: 0;
    font-size: clamp(1.6rem, 6.8vw, 2.15rem);
    font-weight: 600;
    letter-spacing: -.03em;
    min-height: 1.2em;
  }
  .verdict[data-state="on"] { color: var(--good); }
  .verdict[data-state="off"] { color: var(--bad); }
  .verdict[data-state="idle"] { color: var(--muted); }
  .detail {
    margin: .65rem 0 0;
    font-size: clamp(.95rem, 4vw, 1.15rem);
    color: var(--muted);
    min-height: 1.5em;
  }
</style>
</head>
<body>
<main>
  <h1>Is Drew gonna PR?</h1>

  <p class="sentence">
    <span>He hit</span>
    <input id="distance" class="n-dist" type="number" inputmode="decimal" step="any" min="0" aria-label="Distance covered">
    <button type="button" class="unit-switch" id="unitBtn" aria-label="Switch to kilometers">
      <span id="unitWord">miles</span>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M2.2 5.4h11.6M10.9 2.6l2.9 2.8-2.9 2.8M13.8 10.6H2.2M5.1 7.8l-2.9 2.8 2.9 2.8"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="tail">
      <span>in</span>
      <span class="times" role="group" aria-label="Elapsed time">
        <span class="pair"><input id="th" class="n-time" type="number" inputmode="numeric" step="1" min="0" aria-label="Hours"><span>hours,</span></span>
        <span class="pair"><input id="tm" class="n-time" type="number" inputmode="numeric" step="1" min="0" aria-label="Minutes"><span>minutes and</span></span>
        <span class="pair"><input id="ts" class="n-time" type="number" inputmode="numeric" step="1" min="0" aria-label="Seconds"><span>seconds</span></span>
      </span>
    </span>
  </p>

  <p class="verdict" id="verdict" data-state="idle" role="status" aria-live="polite"></p>
  <p class="detail" id="detail"></p>
</main>

<script src="pace.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var distEl = $('distance'), thEl = $('th'), tmEl = $('tm'), tsEl = $('ts');
  var unitWord = $('unitWord'), unitBtn = $('unitBtn');
  var verdict = $('verdict'), detail = $('detail');
  var WORDS = { mi: 'miles', km: 'kilometers' };
  var unit = unitWord.textContent.trim() === WORDS.km ? 'km' : 'mi';
  var km = null; // the last typed distance, kept in km so switching units never drifts

  function num(el) { var v = parseFloat(el.value); return isFinite(v) ? v : 0; }

  function show(text, state, sub) {
    verdict.textContent = text;
    verdict.setAttribute('data-state', state);
    detail.textContent = sub || '';
  }

  function filled(el) { return el.value.trim() !== ''; }

  function rememberTyped() {
    var v = parseFloat(distEl.value);
    km = (isFinite(v) && v > 0) ? Pace.convertDistance(v, unit, 'km') : null;
  }

  function render() {
    // no answer until every field has something in it
    if (!filled(distEl) || !filled(thEl) || !filled(tmEl) || !filled(tsEl)) { show('', 'idle', ''); return; }
    var r = Pace.analyze(num(distEl), unit, num(thEl) * 3600 + num(tmEl) * 60 + num(tsEl));
    var v = Pace.verdictFor(r);
    show(v.text, v.tone, Pace.gapTextFor(r));
  }

  function setUnit(next) {
    if (next === unit) return;
    unit = next;
    unitWord.textContent = WORDS[next];
    unitBtn.setAttribute('aria-label', 'Switch to ' + WORDS[next === 'mi' ? 'km' : 'mi']);
    // take the number with you, so the entry means the same race either way
    if (km !== null) distEl.value = Pace.fmtDistance(Pace.convertDistance(km, 'km', next), next);
    render();
  }

  distEl.addEventListener('input', function () { rememberTyped(); render(); });
  [thEl, tmEl, tsEl].forEach(function (el) { el.addEventListener('input', render); });
  unitBtn.addEventListener('click', function () { setUnit(unit === 'mi' ? 'km' : 'mi'); });

  render();
}());
</script>
</body>
</html>
